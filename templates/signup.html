<!DOCTYPE html>
<html>
<head>
    <title>SkillSwap - Sign Up</title>
</head>
<body>
    <h1>Create Your SkillSwap Account</h1>

    <form method="POST" action="/signup">
        <label>Full Name</label><br>
        <input type="text" name="name" placeholder="Enter your full name" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>

        <label>Password</label><br>
        <input type="password" name="password" placeholder="Create a password" required><br><br>

        <label>Your Skill</label><br>
        <input type="text" name="skill" placeholder="e.g. Graphic Design, Coding, Hairdressing" required><br><br>

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account? <a href="/">Log in</a></p>
</body>
</html>
